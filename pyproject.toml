[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bcheck-mcp"
version = "0.1.0"
description = "MCP server for automating Burp Suite BCheck-based penetration tests via Claude"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "anyio>=4.0.0",
]

[project.scripts]
bcheck-mcp = "bcheck_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bcheck_mcp"]
